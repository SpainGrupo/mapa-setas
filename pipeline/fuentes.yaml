  nombre: "Perímetros de incendios: REDIAM/INFOCA 2008–2025 + EFFIS (MODIS burnt areas) + MFE con fecha"
  rediam_url: "https://www.juntadeandalucia.es/medioambiente/mapwms/REDIAM_perimetros_incendios_forestales?service=WFS&version=2.0.0&request=GetFeature&typeNames=ms:perim_incendios_{anio}&outputFormat=application/json;%20subtype=geojson&srsName=EPSG:25830&bbox={xmin},{ymin},{xmax},{ymax},urn:ogc:def:crs:EPSG::25830"
