# Región Marbella (≤2 h en coche). Valores que antes estaban fijos en el código y en fuentes.yaml
# (spec multi-región §3.1). Lo nacional y compartido (DEM, IGME, MFE, EFFIS, GBIF, acceso a pie) sigue en fuentes.yaml.
id: marbella
nombre: "Marbella"
etiqueta_origen: "de Marbella"
origen: {lon: -4.8825, lat: 36.5101}            # zona.py:11 (antes ORIGEN)

zona:                                           # zona.py: isócrona OSRM
  radio_m: 220000
  paso_m: 5000
  max_s: 7200
  max_snap_m: 5000
  cierre_m: 5000
  osrm: "https://router.project-osrm.org/table/v1/driving/"

osm_extractos:                                  # antes fuentes.yaml osm.url
  # Verificado: 307 → andalucia-AAMMDD.osm.pbf, 200, 195 MB (2026-10-12), cabecera OSMHeader correcta.
  # El extracto es de Andalucía: no incluye Gibraltar.
  - "https://download.geofabrik.de/europe/spain/andalucia-latest.osm.pbf"

capas:
  protegidos:
    - adaptador: rediam_enp
      nombre: "REDIAM — WFS Red de Espacios Naturales Protegidos de Andalucía (RENPA), capa ms:eennpp"
      metodo: wfs
      wfs_url: "https://www.juntadeandalucia.es/medioambiente/mapwms/REDIAM_RENPA"
      capa: "ms:eennpp"
      formato: "GeoJSON; CRS por defecto EPSG:3042 (pedir srsName=EPSG:25830, verificado). Campos: CODIGOESPA, FIGURA, NOMBRE, ZON_PRO, …"
      verificacion: "Caja x 290000-330000, y 4030000-4070000 → 13 espacios (p. ej. PN Sierra de Grazalema)."
      otras_capas: ["ms:red_natura_2000", "ms:reservas_biosfera", "ms:humedales_ramsar", "ms:geoparques"]
      licencia: "CC BY 4.0 (metadatos REDIAM de la RENPA en portalrediam.cica.es/geonetwork); el GetCapabilities dice: uso libre y gratuito mencionando a autores y propietarios. Fees: Gratuito."
      url: "https://www.juntadeandalucia.es/medioambiente/mapwms/REDIAM_RENPA?service=WFS&version=2.0.0&request=GetFeature&typeNames=ms:eennpp&outputFormat=application/json;%20subtype=geojson&srsName=EPSG:25830&bbox={xmin},{ymin},{xmax},{ymax},urn:ogc:def:crs:EPSG::25830"
      tesela_m: 50000
      pagina: 1000000000            # sin paginar: pocos espacios por tesela (protegidos.py PAGINA_ENP)
      cache: enp
  restricciones:
    - adaptador: rediam_porn
      nombre: "REDIAM — WFS Zonificación de los PORN vigentes (capa ms:porn_vigentes)"
      metodo: wfs
      catalogo: "portalrediam.cica.es/geonetwork, ficha 4c51660f84b4b17a0f8b74d2ac70251ae2bfad4c (WMS/WFS Zonificación de los PORN vigentes)"
      campos: "Codigo_espacio, Figura, Nombre, Fecha_publicacion_Plan, Normativa_declaracion_Plan, Codigo_zona, Descripcion_zona, Codigo_subzona, Descripcion_subzona"
      verificacion: "2026-10-14: 118 recintos en la caja de la malla; Zonas de Reserva (A/ARE/R) en Grazalema, Sierra de las Nieves, Los Alcornocales, Tejeda-Almijara-Alhama, Del Estrecho, Maro-Cerro Gordo…; Reservas Naturales (RN) en lagunas."
      licencia: "Uso libre y gratuito mencionando autores y propietarios (GetCapabilities: Fees 'Gratuito'); REDIAM publica sus datos con CC BY 4.0"
      url: "https://www.juntadeandalucia.es/medioambiente/mapwms/REDIAM_zonificacion_PORN_vigentes?service=WFS&version=2.0.0&request=GetFeature&typeNames=ms:porn_vigentes&outputFormat=application/json;%20subtype=geojson&srsName=EPSG:25830&bbox={xmin},{ymin},{xmax},{ymax},urn:ogc:def:crs:EPSG::25830"
      tipos_zona_reserva: ["A", "ARE", "R"]   # Codigo_zona de los PORN con "Reserva" en la descripción
    - adaptador: protegidos_por_figura
      # fuentes.yaml zonificacion_porn.parque_nacional: "Parque Nacional Sierra de las Nieves: de la caché RENPA (enp, FIGURA = 'Parque Nacional')."
      figura: "Parque Nacional"
      tipo: parque_nacional
      zona: "Parque Nacional"
  incendios:
    - adaptador: rediam_por_anio
      catalogo: "portalrediam.cica.es/geonetwork, ficha 933fa6f2-1316-4e99-9baa-49c86d0cfc0c ('Perímetros de incendios forestales en Andalucía 2008-2025', incendios > 10 ha, Centro Operativo Regional del Infoca)"
      licencia: "CC BY 4.0 (ficha de metadatos REDIAM: 'Creative Commons Attribution 4.0 International Public License'); GetCapabilities: uso libre y gratuito mencionando autores y propietarios"
      verificacion: "2026-10-14: capas ms:perim_incendios_2008 … _2025. En la caja de la malla: 2021 → 25 perímetros (Genalguacil/Sierra Bermeja 8 401 ha), 2022 → 27 (Júzcar/Pujerra 4 866 ha), 2023 → 22, 2024 → 11, 2025 → 6. La de 2023 pesa 105 MB (geometría muy detallada)."
      url: "https://www.juntadeandalucia.es/medioambiente/mapwms/REDIAM_perimetros_incendios_forestales?service=WFS&version=2.0.0&request=GetFeature&typeNames=ms:perim_incendios_{anio}&outputFormat=application/json;%20subtype=geojson&srsName=EPSG:25830&bbox={xmin},{ymin},{xmax},{ymax},urn:ogc:def:crs:EPSG::25830"
      desde: 2008
      hasta: 2025
    - adaptador: effis                     # URL en fuentes.yaml → incendios.effis_url (nacional)
  senderos:
    - adaptador: osm_relaciones
    - adaptador: rediam_senderos
      nombre: "REDIAM — WFS Mapa de Equipamientos y Senderos de Uso Público de Andalucía, capa ms:senderos (senderos señalizados y carriles cicloturistas)"
      metodo: wfs
      wfs_url: "https://www.juntadeandalucia.es/medioambiente/mapwms/REDIAM_Equipamientos_Uso_Publico_Andalucia"
      capa: "ms:senderos"
      verificacion: "2026-10-14: caja x 290000-330000, y 4030000-4070000 → 19 senderos (p. ej. YUNQUERA-LOS SAUCES, Media, 8464 m). Campos: fid_1, codigoequi, nombre, t_dificult, modalidad, ofertado, FICHA_VV, longitud. Sin matrícula GR/PR/SL."
      catalogo: "portalrediam.cica.es/geonetwork, ficha e6f9aac9-eadb-4cdf-888d-a04c68909f34 ('Equipamientos y senderos de Uso Público de Andalucía, información actualizada (septiembre 2026)')"
      licencia: "CC BY 4.0 (ficha de metadatos REDIAM); el GetCapabilities del WFS: uso libre y gratuito mencionando a autores y propietarios. Fees: Gratuito."
      atribucion: "REDIAM, Consejería de Sostenibilidad y Medio Ambiente, Junta de Andalucía (CC BY 4.0)"
      url_patron: "https://www.juntadeandalucia.es/medioambiente/mapwms/REDIAM_Equipamientos_Uso_Publico_Andalucia?service=WFS&version=2.0.0&request=GetFeature&typeNames=ms:senderos&outputFormat=application/json;%20subtype=geojson&srsName=EPSG:25830&bbox={xmin},{ymin},{xmax},{ymax},urn:ogc:def:crs:EPSG::25830"
      tesela_m: 50000

  # Titularidad (2026-10-15, titularidad.py; antes fuentes.yaml montes_publicos | vias_pecuarias | cotos_caza)
  montes_publicos:
    - adaptador: rediam_montes
      nombre: "REDIAM — Catálogo (Registro) de Montes Públicos de Andalucía, WFS, capa ms:Catalogo_Montes_Públicos_Andalucia"
      url_patron: "https://www.juntadeandalucia.es/medioambiente/mapwms/REDIAM_Catalogo_Montes_Publicos_Andalucia?service=WFS&version=2.0.0&request=GetFeature&typeNames=ms:Catalogo_Montes_P%C3%BAblicos_Andalucia&outputFormat=application/json;%20subtype=geojson&srsName=EPSG:25830&bbox={xmin},{ymin},{xmax},{ymax},urn:ogc:def:crs:EPSG::25830"
      verificacion: "2026-10-15: caja x 320000-340000, y 4040000-4060000 → 12 montes (5 Comunidad Autónoma de Andalucía, 6 Ayuntamiento, 1 Otras Entidades Públicas). Campos: id, codigo_ja, nombre, provincias, tipo_titul, acceso_inf, sup_ha."
      ficha: "portalrediam.cica.es/geonetwork, c3f9579d16afd3aabd4c0d180f135cf678384aa6 (actualizada 07-10-2026)"
      limitacion: "No distingue los montes de ayuntamiento gestionados por la Junta de los que no (PENDIENTE)."
      licencia: "Uso libre y gratuito mencionando a autores y propietarios (AccessConstraints del WFS); el repo trata REDIAM como CC BY 4.0."
      atribucion: "REDIAM, Junta de Andalucía"
      tesela_m: 25000                       # titularidad.py TESELA_M
      cache: montes_publicos
      titular_autonomico: "Comunidad Autónoma de Andalucía"          # tipo_titul → monte_junta
      titulares_municipales: ["Ayuntamiento", "Otras Entidades Públicas"]   # tipo_titul → monte_municipal
  cotos_caza:
    - adaptador: rediam_cotos
      nombre: "REDIAM — Terrenos cinegéticos vigentes (temporada 2025-26), capa ms:Terrenos_cinegeticos_vigentes"
      url_patron: "https://www.juntadeandalucia.es/medioambiente/mapwms/REDIAM_terrenos_cinegeticos_vigentes?service=WFS&version=2.0.0&request=GetFeature&typeNames=ms:Terrenos_cinegeticos_vigentes&outputFormat=application/json;%20subtype=geojson&srsName=EPSG:25830&bbox={xmin},{ymin},{xmax},{ymax},urn:ogc:def:crs:EPSG::25830"
      verificacion: "2026-10-15: caja x 320000-340000, y 4040000-4060000 → 20 recintos (11 cotos privados, 8 deportivos, 1 reserva andaluza). Sin campo de cercado."
      uso: "Solo refuerza el aviso de finca privada; nunca lo quita."
      atribucion: "REDIAM, Junta de Andalucía"
      tesela_m: 25000
      cache: cotos_caza
  pasos_publicos:                           # orden = el de la capa «pasos»: vías pecuarias y luego senderos
    - adaptador: rediam_vias_pecuarias
      nombre: "REDIAM — Inventario de vías pecuarias (dic. 2025), WFS Patrimonio Natural, capa ms:inventario_vvpp"
      url_patron: "https://www.juntadeandalucia.es/medioambiente/mapwms/REDIAM_WFS_Patrimonio_Natural?service=WFS&version=2.0.0&request=GetFeature&typeNames=ms:inventario_vvpp&outputFormat=application/json;%20subtype=geojson&srsName=EPSG:25830&bbox={xmin},{ymin},{xmax},{ymax},urn:ogc:def:crs:EPSG::25830"
      verificacion: "2026-10-15: caja x 320000-340000, y 4040000-4060000 → 15 tramos (p. ej. CORDEL DE BENAHAVIS A OJEN). El servicio REDIAM_Inventario_VVPP da 504 con cajas de 20 km; este no."
      aviso: "El trazado de las vías pecuarias no deslindadas es aproximado (metadatos REDIAM)."
      atribucion: "REDIAM, Junta de Andalucía"
      tesela_m: 25000
      cache: vias_pecuarias
    - adaptador: rediam_senderos            # sin url_patron: usa la fuente rediam_senderos de capas.senderos

especies:                                       # orden = el de especies.yaml (el manifest sigue el catálogo)
  activas: [boletus_aereus, boletus_aestivalis, boletus_edulis, boletus_pinophilus, amanita_caesarea,
            lactarius_deliciosus, lactarius_sanguifluus, cantharellus_cibarius, amanita_ponderosa,
            macrolepiota_procera, pleurotus_eryngii, terfezia_arenaria,
            # 2026-10-18: con citas GBIF a ≤200 km (ver especies.yaml y knowledge/reference/especies-y-grupos.md)
            suillus_collinitus, lepista_nuda, agaricus_campestris, hydnum_repandum, morchella_spp,
            suillus_bellinii, suillus_luteus, suillus_granulatus, russula_cyanoxantha, tricholoma_portentosum,
            # 2026-10-20: excepción SIN_CONF aprobada por Alexander (guia/_build/build.py)
            craterellus_cornucopioides, pleurotus_ostreatus]
  sin_habitat: []
overrides_especies:                             # 2026-10-20, aprobado por Alexander: docs/investigacion/2026-10-18-citas-abiertas.md §4.1
  # Níscalos a nivel del mar en los pinares costeros del Estrecho: 9 de 24 citas de L. deliciosus que calibran están
  # por debajo de 200 m. Solo Marbella; Alicante no cambia.
  lactarius_deliciosus: {altitud: {min: 0, opt_min: 300, opt_max: 1500, max: 1900}}
  lactarius_sanguifluus: {altitud: {min: 0, opt_min: 300, opt_max: 1500, max: 1900}}

edificado:                                      # edificado.py (2026-10-15); ATOM nacional en fuentes.yaml catastro_bu
  catastro_provincias: ["11", "14", "18", "29", "41"]   # Cádiz, Córdoba, Granada, Málaga, Sevilla (antes PROVINCIAS)

citas:                                          # citas.py (2026-10-15)
  centro: {lon: -4.88, lat: 36.51}              # antes CENTRO (redondeado; no es el origen exacto)
  radio_km: 200
  # CSV de sitios de foros/literatura (lugar, lat, lon, precision, especies, fecha, fuente_url, confianza, cita).
  # Relativo a pipeline/regiones/ (versionado).
  sitios_csv: "marbella-sitios-conocidos.csv"
  taxa:                                         # taxones de las especies nuevas (citas.py TAXA tiene el resto)
    suillus_collinitus: ["Suillus collinitus"]
    suillus_luteus: ["Suillus luteus"]
    suillus_granulatus: ["Suillus granulatus"]
    morchella_spp: ["Morchella esculenta", "Morchella elata", "Morchella conica"]
    tricholoma_portentosum: ["Tricholoma portentosum"]
    craterellus_cornucopioides: ["Craterellus cornucopioides", "Craterellus lutescens"]   # 2026-10-20: una ficha para las dos
    pleurotus_ostreatus: ["Pleurotus ostreatus"]

legal:
  aviso: &aviso "Málaga (Res. 23-09-2026, BOJA 196, vigente hasta 31-05-2027): autoconsumo ≤3 kg por persona y día sin autorización en montes públicos, salvo Zonas de Reserva; de día, sin rastrillos ni remover el mantillo. Fincas privadas: permiso del propietario. Cádiz: la última resolución encontrada es de 2019, sin confirmar su vigencia."
  tipos_restriccion:                            # exportar.py TEXTO_RESTRICCION (docs/investigacion/2026-10-14-factores-y-trucos.md §4)
    zona_reserva: "Zona de Reserva del espacio protegido: recolectar setas exige autorización previa."
    reserva_natural: "Reserva Natural: recolectar setas exige autorización previa."
    parque_nacional: "Parque Nacional Sierra de las Nieves: trátalo como recolección con autorización (Ley 9/2021); no recolectes sin permiso."
  ccaa:
    - id: AND
      nombre: "Andalucía"
      norma: "Resolución de 23-09-2026, DT de Sostenibilidad y Medio Ambiente de Málaga (BOJA 196, 08-10-2026)"
      cupo_kg_dia: 3
      texto: *aviso
      # PENDIENTE: cotejar con el PDF del BOJA y decidir con Alexander si pasa a true (el texto incluye Cádiz sin confirmar).
      verificado: false
      fuente_url: "https://www.juntadeandalucia.es/boja/2026/196/BOJA26-196-00003-13150-01_00344382.pdf"
  titularidad:                                  # titularidad.py (antes TEXTOS, AVISO, NORMA)
    textos:
      monte_junta: "Monte público (Junta)"
      monte_municipal: "Monte público municipal: consulta al ayuntamiento"
      privado: "Probablemente privado: necesitas permiso del dueño para recoger"
      paso_publico: "Paso público, no recoger fuera"
      coto: "Coto de caza"
      senal_privado: "Valla, cancela o paso privado cerca"
    norma: "Ley 43/2003 de Montes, art. 36.1: el titular del monte es el propietario de sus frutos espontáneos. Resolución de 23-09-2026 (BOJA 196), punto 8: en terrenos particulares hace falta la autorización del propietario para recoger setas."
    aviso: "No hay datos abiertos fiables de vallas ni de quién es dueño de cada finca. Fuera de los montes públicos marcados, asume que es privado y pide permiso. Ley 43/2003 de Montes, art. 36.1: el titular del monte es el propietario de sus frutos espontáneos. Resolución de 23-09-2026 (BOJA 196), punto 8: en terrenos particulares hace falta la autorización del propietario para recoger setas."

atribuciones:
  idoneidad: "IGN CC BY 4.0 · © MITECO MFE · IGME · REDIAM CC BY 4.0 · Catastro INSPIRE (D. G. del Catastro) · © OpenStreetMap ODbL"   # exportar.py:353, respaldo.py:40
  protegidos: "REDIAM CC BY 4.0"                                                              # exportar.py:423
  restricciones: "REDIAM CC BY 4.0 (zonificación PORN, RENPA)"                                # exportar.py:488
  rutas: "© OpenStreetMap (ODbL); REDIAM, Junta de Andalucía (CC BY 4.0)"                     # rutas.py:141
  respaldo_protegidos: "Espacios protegidos: REDIAM (Junta de Andalucía), CC BY 4.0"          # respaldo.py:346
  mapa: "IGN CC BY 4.0, © MITECO MFE, IGME, REDIAM CC BY 4.0, Catastro INSPIRE (D. G. del Catastro), © OpenStreetMap ODbL, Protomaps"   # control del mapa en la app (antes LEGADO_MARBELLA de app/src/manifest-region.ts)
  titularidad: "REDIAM, Junta de Andalucía (montes públicos, vías pecuarias, senderos, cotos) · © OpenStreetMap ODbL"  # titularidad.py ATRIBUCION

notas_fuentes:
  mfe_provincias: [Malaga, Cadiz, Sevilla, Granada, Cordoba]   # antes fuentes.yaml mfe.provincias (solo documentación)
