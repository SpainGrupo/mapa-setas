# HEURÍSTICO v1 — valores de partida de literatura micológica divulgativa;
# se recalibran con GBIF (Tarea 9) y hallazgos propios. No son ciencia exacta.
# tiempo: episodio_mm = lluvia en ≤3 días seguidos que dispara la fructificación; ventana_dias = días
# tras el episodio; tmin_media/tmax_media = rango favorable de la media de mínimas/máximas de 10 días.
# tiempo v2 (2026-10-14, docs/investigacion/2026-10-14-factores-y-trucos.md recs. 1, 5, 6; todo HEURÍSTICO):
#   balance_30d_min_mm = mínimo de Σ(lluvia − ET0 FAO) en 30 días (Martínez de Aragón 2007: P−ETP de sep-oct
#   explica la producción; sin umbral publicado: con ET0 de octubre ~2,5 mm/día, −30 exige ≈45 mm en el mes);
#   dias_lluvia_30d_min = días con ≥1 mm en 30 días (Karavani 2018: el nº de días de lluvia predice mejor que los mm);
#   humedad_suelo_min = m³/m³ a 9-27 cm de Open-Meteo que basta aunque el balance no llegue (Karavani: humedad del
#   suelo, mejor predictor; 0,15 ≈ mitad entre suelo seco de septiembre ~0,10 y tras lluvia ~0,18 en Los Alcornocales,
#   medido en Open-Meteo el 2026-10-14). Basta balance O suelo, y además los días de lluvia.
#   meses = temporada; fuera, rojo salvo episodio ≥1,5 × episodio_mm con humedad suficiente (semaforo.ts).
boletus_aereus:
  nombre: Boletus aereus
  arboles: {alcornoque: 1.0, castano: 0.9, encina: 0.8, quejigo: 0.7}
  altitud: {min: 0, opt_min: 300, opt_max: 900, max: 1200}   # calibrado 2026-10-13: alcornocal costero 15-150 m
  orientacion: indiferente
  suelo: {acido: 1.0, otro: 0.5, basico: 0.4, ultrabasico: 0.3, desconocido: 0.6}
  tiempo: {episodio_mm: 25, ventana_dias: [8, 20], tmin_media: [8, 18], tmax_media: [15, 27], balance_30d_min_mm: -30, dias_lluvia_30d_min: 3, humedad_suelo_min: 0.15, meses: [5, 6, 9, 10, 11, 12]}   # heurístico v2: meses con brote de primavera may-jun [inv. §1, F6/G7]
boletus_aestivalis:
  nombre: Boletus aestivalis / reticulatus
  arboles: {castano: 1.0, quejigo: 0.9, alcornoque: 0.7, encina: 0.7}
  altitud: {min: 300, opt_min: 500, opt_max: 1100, max: 1400}
  orientacion: indiferente
  suelo: {acido: 1.0, otro: 0.6, basico: 0.6, ultrabasico: 0.3, desconocido: 0.6}
  tiempo: {episodio_mm: 20, ventana_dias: [7, 18], tmin_media: [10, 20], tmax_media: [18, 30], balance_30d_min_mm: -30, dias_lluvia_30d_min: 3, humedad_suelo_min: 0.15, meses: [5, 6, 9, 10, 11]}   # heurístico v2: may-jun + otoño [inv. §5 #6]
boletus_edulis:
  nombre: Boletus edulis
  arboles: {castano: 1.0, pino: 0.7, pinsapo: 0.6, quejigo: 0.5}
  altitud: {min: 600, opt_min: 900, opt_max: 1500, max: 1900}
  orientacion: umbria
  suelo: {acido: 1.0, otro: 0.6, basico: 0.5, ultrabasico: 0.4, desconocido: 0.6}
  tiempo: {episodio_mm: 25, ventana_dias: [8, 21], tmin_media: [5, 15], tmax_media: [12, 24], balance_30d_min_mm: -20, dias_lluvia_30d_min: 4, humedad_suelo_min: 0.15, meses: [9, 10, 11, 12]}   # heurístico v2: sep-dic; montano, pide más días de lluvia [inv. §2 Karavani]
boletus_pinophilus:
  nombre: Boletus pinophilus
  arboles: {pino: 1.0, castano: 0.5}
  altitud: {min: 700, opt_min: 1000, opt_max: 1600, max: 2000}
  orientacion: umbria
  suelo: {acido: 1.0, otro: 0.6, basico: 0.4, ultrabasico: 0.4, desconocido: 0.6}
  tiempo: {episodio_mm: 25, ventana_dias: [8, 21], tmin_media: [4, 14], tmax_media: [10, 22], balance_30d_min_mm: -20, dias_lluvia_30d_min: 4, humedad_suelo_min: 0.15, meses: [9, 10, 11, 12]}   # heurístico v2: sep-dic como edulis (pinar, sin cita propia)
amanita_caesarea:
  nombre: Amanita caesarea
  arboles: {alcornoque: 1.0, castano: 1.0, encina: 0.8, quejigo: 0.7, pino: 0.4}   # pino: pinares con alcornoque/encina de sotobosque
  altitud: {min: 0, opt_min: 200, opt_max: 900, max: 1200}
  orientacion: solana
  suelo: {acido: 1.0, otro: 0.5, basico: 0.3, ultrabasico: 0.3, desconocido: 0.6}
  tiempo: {episodio_mm: 20, ventana_dias: [7, 16], tmin_media: [12, 20], tmax_media: [20, 30], balance_30d_min_mm: -30, dias_lluvia_30d_min: 3, humedad_suelo_min: 0.15, meses: [7, 8, 9, 10, 11]}   # heurístico v2: jul-nov (termófila, sin cita de meses en inv.)
