# ---------------------------------------------------------------- Fase 8 (2026-10-14)
acceso_pie:
  nombre: "Tiempo a pie desde el coche (setas_pipeline/acceso.py)"
  entradas: "MDT25 IGN (dem, arriba) promediado 2×2 a 50 m; OSM (osm, arriba): vías de coche, caminos y agua"
  vias_coche: "highway trunk/primary/secondary/tertiary/unclassified/residential/service, y track solo con tracktype grade1/grade2; se excluyen access/motor_vehicle/motorcar/vehicle = no|private"
  caminos_pie: "highway path/track/footway/bridleway/steps/pedestrian/cycleway/living_street/*_link y todas las de coche (× 1,0); campo a través × 1,6"
  intransitable: "natural=water, landuse=reservoir, waterway=riverbank (salvo por camino) y mar (cota ≤ 0). Edificios no: a 50 m cerrarían las calles de los pueblos."
  licencia: "Derivado de IGN (CC BY 4.0 scne.es) y OpenStreetMap (ODbL 1.0)"
  atribucion: "MDT © IGN/CNIG; © colaboradores de OpenStreetMap (ODbL)"

rutas_osm:
