mfe:
  nombre: "Mapa Forestal de España (MFE, 'foto fija'), WFS del IEPNB (MITECO), capa foto_fija_mfe:ff_tipo_bosque"
  metodo: wfs
  # La descarga por CCAA (https://gis.miteco.gob.es/descargas/app/DescargaFichero?f=mfe_andalucia.zip,
  # shapefile 885 MB, toda Andalucía, no por provincia) exige superar un reto ALTCHA (anti-bot):
  # no automatizable. Se usa el WFS, que sí es público y lleva los mismos campos y códigos.
  wfs_url: "https://geoserver.iepnb.es/geoserver/wfs"
  capa: "foto_fija_mfe:ff_tipo_bosque"
  # Plantilla verificada (GeoJSON en EPSG:25830, bbox en 25830):
  url_patron: "https://geoserver.iepnb.es/geoserver/wfs?service=WFS&version=2.0.0&request=GetFeature&typeNames=foto_fija_mfe:ff_tipo_bosque&outputFormat=application/json&srsName=EPSG:25830&bbox={xmin},{ymin},{xmax},{ymax},EPSG:25830"
  formato: "GeoJSON (application/json). También SHAPE-ZIP y GeoPackage. Geometría MultiPolygon."
  volumen: >-
    57 625 recintos en la caja x 160000-410000, y 3990000-4170000 (resultType=hits). Una petición de
    60x40 km devolvió 7 632 recintos sin paginar (sin geometría, 1 MB); con geometría son unos 4 KB por
    recinto, así que conviene trocear la zona en teselas de unos 25-50 km y deduplicar por id_ff21.
    Admite count/startIndex.
  cobertura: "Recintos con y sin arbolado (aparecen 'Desarbolado', id_sp1=0). Provincias vistas en la muestra: Málaga, Cádiz."
  provincias: [Malaga, Cadiz, Sevilla, Granada, Cordoba]   # el WFS es nacional: se filtra por bbox, no por provincia
  url_por_provincia: "No aplica: el WFS es nacional y se consulta por bbox (ver url_patron)."
  campo_especie_dominante: id_sp1          # int; nombre en nom_sp1. Especie 1 = la de mayor ocupación (nm_o1)
  campo_nombre_especie: nom_sp1
  tabla_codigos_especie: "https://www.miteco.gob.es/content/dam/miteco/es/cartografia-y-sig/ide/descargas/mfe25_dd.xlsx (hoja 'Especies (arbóreas)'); el código 0 = 'Sin especie arbórea' solo aparece en el WFS"
  licencia: "Uso libre y gratuito citando: «© Ministerio para la Transición Ecológica y el Reto Demográfico» (condiciones de la página de descarga del MFE25 Andalucía). El GetCapabilities del WFS declara AccessConstraints NONE, Fees NONE."
  # Clave = código id_sp1 como texto. Lo que no esté aquí → 'otro'; nulo → 'sin_arbolado'.
  # Códigos y nombres tal cual en mfe25_dd.xlsx y, los marcados (*), vistos también en la muestra WFS del Genal/Alcornocales.
  mapeo_arbol:
    "0": sin_arbolado     # Sin especie arbórea (*)
    "46": alcornoque      # Quercus suber (*)
    "45": encina          # "Quercues ilex" en el diccionario; "Quercus ilex " en el WFS (*)
    "245": encina         # Quercus ilex ssp. Ilex
    "44": quejigo         # Quercus faginea (*)
    "47": quejigo         # Quercus canariensis (*)
    "344": quejigo        # Quercus alpestris (quejigo de montaña; decidido 2026-10-13)
    "72": castano         # Castanea sativa (*)
    "20": pino            # Pinos
    "21": pino            # Pinus sylvestris
    "22": pino            # Pinus uncinata
    "23": pino            # Pinus pinea (*)
    "24": pino            # Pinus halepensis (*)
    "25": pino            # Pinus nigra (*)
    "26": pino            # Pinus pinaster (*)
    "27": pino            # Pinus canariensis
    "28": pino            # Pinus radiata (*)
    "29": pino            # Otros pinos
    "229": pino           # Pinus banksiana
    "230": pino           # Pinus strobus
    "32": pinsapo         # Abies pinsapo (*)
  notas_mapeo:
    - "344 Quercus alpestris (vista en la muestra, 3 recintos) → quejigo (decidido 2026-10-13)."
    - "Ojo en clasificar(): si la columna id_sp1 llega como float (por nulos), str(72.0) = '72.0' y no casaría. Convertir a Int64 antes."

geologia:
  nombre: "IGME GEODE — Cartografía geológica continua 1:50.000, capa 'Recintos geología'"
  metodo: arcgis_rest
  url: "https://mapas.igme.es/gis/rest/services/Cartografia_Geologica/IGME_Geode_50/MapServer/8/query"
  # Plantilla verificada (GeoJSON en EPSG:25830, bbox en 25830). maxRecordCount = 1000 → paginar con resultOffset.
  url_patron: "https://mapas.igme.es/gis/rest/services/Cartografia_Geologica/IGME_Geode_50/MapServer/8/query?where=1%3D1&geometry={xmin},{ymin},{xmax},{ymax}&geometryType=esriGeometryEnvelope&inSR=25830&outSR=25830&spatialRel=esriSpatialRelIntersects&outFields=DESC_UNIT,CODE_UNIO&returnGeometry=true&orderByFields=OBJECTID&resultOffset={offset}&resultRecordCount=1000&f=geojson"
  formato: "GeoJSON (f=geojson), también JSON Esri. Capacidades: Map,Query,Data; soporta paginación."
  volumen: "38 267 recintos en la caja lon -6.2..-3.6, lat 36.0..37.6 → unas 39 páginas de 1000."
  campo_litologia: DESC_UNIT      # texto, alias 'Descripción Unidad Geológica'. CODE_UNIO = código de unidad
  licencia: "LICENCIA DE USO: Condiciones de uso público y difusión de la información para la reutilización de los datos IGME, https://www.igme.es/condiciones-de-uso/ (metadatos GEODE zona 2100, catalogo.igme.es)"
  # Subcadenas en minúsculas (clasificar_litologia hace lower() pero no quita tildes, por eso van con tilde).
  # Elegidas sobre los 258 textos DESC_UNIT reales de la zona. Orden de evaluación: ultrabasico → acido → basico.
  mapeo_suelo:
    ultrabasico: ["peridotit", "serpentin", "lherzolit", "harzburgit", "dunita", "tectonitas con espinela"]
    acido: ["granit", "granodiorit", "gneis", "migmat", "pizarra", "esquisto", "cuarcit", "filita", "grauvaca", "grauwaca", "metarenisca", "areniscas del aljibe", "arenas silíceas", "areniscas cuarzo"]
    basico: ["caliza", "calizo", "dolom", "marga", "yeso", "mármol", "marmol", "calcarenit", "calcáre", "carbonat", "travertin", "calcilimolit"]
  notas_mapeo:
    - "Comprobado sobre la zona: Sierra Bermeja = 'Lherzolitas con plagioclasa' (49 %) + 'Tectonitas con espinela' (21 %) + 'Peridotitas granulares' (6 %) → ultrabásico; Los Alcornocales = 'Areniscas del Aljibe' (65 %) → ácido; Grazalema y Sierra de las Nieves con dolomías/calizas → básico (Nieves tiene además 44 % de lherzolitas)."
    - "Reparto aproximado por área en la zona: otro 48,7 % (cuaternario, 'Unidad olistostrómica', arcillas…), básico 39,2 %, ácido 10,4 %, ultrabásico 1,6 %."
    - "Areniscas genéricas ('Areniscas', 'Areniscas y arcillas') quedan en 'otro' a propósito: hay muchas 'Areniscas calcáreas' y con la prioridad ácido > básico una palabra 'arenisca' las haría ácidas."
    - "Casos límite aceptados: 'Calcoesquistos…' y 'Calizas turbidíticas…, grauwacas y pelitas' salen ácidos por 'esquisto'/'grauwaca'; 'Rocas Básicas (Gabros…)', 'Diabasa', 'Ofitas' salen 'otro'."

