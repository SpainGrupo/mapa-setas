  orientacion: umbria
  suelo: {basico: 1.0, otro: 0.7, acido: 0.3, ultrabasico: 0.3, desconocido: 0.6}
  dosel: {opt: [40, 75]}   # como L. sanguifluus (mismo pinar)
  humedad: 0.1
  tiempo: {episodio_mm: 25, ventana_dias: [20, 40], tmin_media: [2, 12], tmax_media: [8, 18], balance_30d_min_mm: -30, dias_lluvia_30d_min: 4, humedad_suelo_min: 0.15, meses: [11, 12, 1]}   # INV §2; balance/días/suelo como L. sanguifluus
suillus_collinitus:
  nombre: Suillus collinitus
