# ---------------------------------------------------------------- Marbella, 2026-10-20 (excepción SIN_CONF aprobada por Alexander)
# HEURÍSTICOS y sin calibrar hasta que calibracion.py dé n ≥ MIN_OBS. Citas GBIF a ≤200 km de Marbella (consulta
# 18-10-2026): C. cornucopioides 20 (Los Alcornocales) · C. lutescens 6 · P. ostreatus 88. Fuentes: [FN] First Nature,
# fichas C. cornucopioides / P. ostreatus · [AC] AmanitaCesarea.com, fichas C. lutescens / P. ostreatus. Lo que las
# fuentes no cifran va marcado PENDIENTE y copia a la especie más parecida.
craterellus_cornucopioides:
  nombre: Craterellus cornucopioides / lutescens
  # Trompeta de los muertos: bajo frondosas, sobre todo haya y robles [FN]; angula de monte: sobre todo coníferas, también robles [AC]
  arboles: {alcornoque: 1.0, castano: 0.9, quejigo: 0.9, encina: 0.8, pino: 0.5}   # PENDIENTE: pesos de partida (frondosas > coníferas [FN, AC])
  altitud: {min: 0, opt_min: 200, opt_max: 1000, max: 1400}   # PENDIENTE: sin cifra; como C. cibarius
  orientacion: umbria      # PENDIENTE
  suelo: {acido: 1.0, otro: 0.6, basico: 0.4, ultrabasico: 0.4, desconocido: 0.6}   # PENDIENTE: sin fuente de sustrato; como C. cibarius
  dosel: {opt: [50, 85]}   # PENDIENTE
  humedad: 0.25            # AC: «zonas húmedas» (C. lutescens)
  tiempo: {episodio_mm: 20, ventana_dias: [10, 25], tmin_media: [7, 16], tmax_media: [14, 25], balance_30d_min_mm: -20, dias_lluvia_30d_min: 4, humedad_suelo_min: 0.16, meses: [10, 11, 12, 1]}   # «hasta bien entrado el año nuevo» en la Península [FN]; «principio de otoño hasta el invierno» [AC]; plazos como C. cibarius
pleurotus_ostreatus:
  nombre: Pleurotus ostreatus
  # Lignícola: troncos y tocones de frondosas (chopo, álamo, fresno, olmo, haya, robles), a veces parásita [AC, FN]
  arboles: {otro: 1.0, quejigo: 0.8, castano: 0.7, encina: 0.5, alcornoque: 0.5}   # PENDIENTE: pesos de partida; «otro» agrupa chopos y fresnos de ribera que el MFE no separa
  micorrizica: false       # saprótrofa: el incendio no la penaliza como a las micorrícicas
  altitud: {min: 0, opt_min: 0, opt_max: 800, max: 1500}   # PENDIENTE: sin cifra
  orientacion: indiferente
  suelo: {basico: 1.0, otro: 1.0, acido: 1.0, ultrabasico: 0.8, desconocido: 0.9}   # PENDIENTE: crece en madera, no depende del suelo
  humedad: 0.3             # PENDIENTE: choperas y riberas (AC: tocones de choperas)
  tiempo: {episodio_mm: 20, ventana_dias: [10, 20], tmin_media: [4, 16], tmax_media: [12, 24], balance_30d_min_mm: -30, dias_lluvia_30d_min: 3, humedad_suelo_min: 0.15, meses: [10, 11, 12, 1, 2]}   # «hasta enero o febrero» en el sur de Europa [FN]; plazos como P. eryngii (PENDIENTE)
