<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anatomy sheet</title>
<style>body{margin:16px;font:14px/1.3 -apple-system,system-ui,sans-serif;color:#1d2a20;background:#f3efe6}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.c{background:#fff;border:1px solid #bbb;border-radius:10px;padding:10px}
.c div{max-width:180px;margin:auto}.c p{margin:6px 0 0;text-align:center;font-weight:600}</style>
<div class="g" id="g"></div><script src="anatomia.js"></script>
<script>const g=document.getElementById('g');for(const k in ANAT){const c=document.createElement('div');c.className='c';c.innerHTML=`<div data-anat="${k}"></div><p>${ANAT[k].titulo}<br><small>${k}</small></p>`;g.append(c)}ANAT_FILL();</script>
