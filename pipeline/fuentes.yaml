# ---------------------------------------------------------------- Modelo v2 (2026-10-14)
mfe_estructura:
  nombre: "MFE (mismo WFS y caché que mfe): nm_fccarb (FCC arbolada %), nom_e1 (estado de masa especie 1), id_evento/fc_evento"
  verificacion: >-
    2026-10-14 sobre la caché data/raw/mfe (20 776 recintos arbolados): nom_e1 Fustal 11 836, Latizal 7 227,
    Monte bravo 1 435, Repoblado 278; nm_fccarb 10–100 %; nb_evento "Procede de incendio con fecha" 22
    (fc_evento 2015–2021), "…sin fecha…" 58 (sin año: no se usan).
  salidas: [fcc.tif, estado.tif]
  licencia: "© MITECO (ver mfe)"

mfe_desarbolado:
  nombre: "MFE, recintos 'Desarbolado' forestal (id_clamfe = 140) → cubierta abierta (matorral / pastizal)"
  metodo: wfs
  filtro: "id_clamfe=140"
  pagina: 300
  verificacion: >-
    2026-10-14: 11 954 recintos en la caja de la malla (resultType=hits); descargados 10 444 dentro de la zona
    (caché data/raw/mfe_desarbolado). Por superficie: Pastizal-Matorral 107 710 ha, Arbustedos 75 367 ha,
    Herbazal-Pastizal 65 978 ha. El MFE no distingue especies de matorral (no hay jara): el gurumelo usa
    "matorral a ≤300 m" como proxy de jaral (heurístico).
  decision_siose: >-
    SIOSE no se pudo obtener de forma automatizable: el WFS INSPIRE de ocupación del suelo del IGN
    (servicios.idee.es/wfs-inspire/ocupacion-suelo) devolvió respuestas vacías el 2026-10-14 y REDIAM no publica
    SIOSE por WFS (solo MUCVA 2007). La investigación (§3) da el nb_tipestr del MFE como primera aproximación:
    es la misma fuente y escala 1:25 000 que el arbolado. PENDIENTE: SIOSE-AR por descarga del CNIG si hace falta.
  # id_tipestr → clase de CUBIERTA (malla.py). Lo no listado → ninguna (roquedo, humedal, quemado, playas…).
  mapeo_cubierta:
    matorral: [21, 22, 25, 27]       # Arbustedos, Galerías arbustivas, Msc matorral/cultivo, Sup. forestal residual arbustiva
    pastizal_matorral: [23, 24]      # Pastizal-Matorral, Msc matorral/pastizal
    pastizal: [31, 32, 33, 37]       # Herbazal-Pastizal, Msc pastizal/cultivo, Galería de herbáceas, Sup. forestal residual herbácea
  salidas: [cubierta.tif, dist_matorral.tif]
  licencia: "© MITECO (ver mfe)"

