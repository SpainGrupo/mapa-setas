terfezia_claveryi:
  nombre: Terfezia claveryi
  # Turma: tomillar/jaral de Helianthemum sobre caliza o yeso, al revés que T. arenaria (ácida) [S12; INV §2].
  # GBIF 0 en la zona: perfil por literatura. El MFE no ve Helianthemum: matorral/pastizal es la aproximación.
  arboles: {}
