name = "setas-identificar"
main = "src/index.ts"
compatibility_date = "2026-09-28"

[vars]
# Modelo por defecto: gemini-3.8-flash (Flash estable más reciente; entrada de imagen y
# salidas estructuradas admitidas, salida solo texto, 1M tokens de entrada).
# Fuentes, consultadas el 2026-10-13:
#   https://ai.google.dev/gemini-api/docs/models
#   https://ai.google.dev/gemini-api/docs/models/gemini-3.8-flash  (página actualizada 2026-09-02)
# Alternativa más barata si hiciera falta: gemini-3.5-flash-lite (estable).
GEMINI_MODEL = "gemini-3.8-flash"
# Orígenes permitidos, separados por comas, sin barra final. Producción: GitHub Pages
# (https://spaingrupo.github.io/mapa-setas/; la ruta no forma parte del origen).
# Para `wrangler dev` en local, añade los localhost en .dev.vars (ALLOWED_ORIGINS=...).
ALLOWED_ORIGINS = "https://spaingrupo.github.io"
# Reconocimientos por IP y día.
DAILY_LIMIT = "50"
# Tope global de reconocimientos por día (todas las IPs). Cubre la rotación de IP: la cabecera
# Origin la falsifica cualquier cliente que no sea un navegador, así que el límite por IP no basta.
GLOBAL_DAILY_LIMIT = "300"
# POST /explorar (barrido de 8 fotos): cupo propio, aparte del de /identificar para que explorar no
# se coma los reconocimientos. Barridos por IP y día, y tope global por día (todas las IPs).
# Valores de partida del spec explorar-aqui §4.3 / plan Decisiones §2; ajustar al gasto asumible.
EXPLORAR_DAILY_LIMIT = "10"
EXPLORAR_GLOBAL_LIMIT = "60"
# "true" en producción: sin KV (o si KV falla) el Worker responde 503 y no llama a Gemini.
# Poner "false" solo en desarrollo local sin KV.
REQUIRE_KV = "true"

# --- Chat «Pregunta a Claude» (POST /chat; spec docs/specs/2026-10-20-pregunta-a-claude-design.md) ---
# Modelo y esfuerzo de razonamiento. Alternativas: claude-sonnet-5-5 (más barato) o claude-haiku-5-5 (sin reintento por rechazos).
CLAUDE_MODEL = "claude-opus-5-5"
CLAUDE_EFFORT = "low"
# Consultas nuevas por IP y día (las rondas de herramientas de una misma consulta no cuentan).
CHAT_DAILY_LIMIT = "30"
# Topes de gasto globales en USD (día y mes UTC). Superados -> 429 tope_gasto sin llamar a Claude.
# La red de seguridad real es el límite de gasto del workspace en console.anthropic.com.
CHAT_DAILY_USD = "1.5"
CHAT_MONTHLY_USD = "25"
# Auditoría de seguridad 2026-11-08: el historial lo manda el cliente y se puede falsificar para que una consulta
# parezca una ronda de herramientas (que no gasta cupo). Por eso también se cuentan TODAS las peticiones por IP
# (IPv6 agrupadas por /64) y hay tope de gasto por IP, para que una sola IP no agote el tope global del día.
CHAT_PETICIONES_DIA = "150"
CHAT_IP_DAILY_USD = "0.5"
# Fotos y enlaces de Maps en el chat (2026-11-08): POST /resolver-enlace sigue enlaces cortos de Google Maps (solo hosts de
# Google, máx. 5 saltos) y devuelve lat/lon. Enlaces resueltos por IP y día. Las fotos (≤3 por mensaje, ≤1,5 MB cada una,
# solo base64) pagan tokens reales: cuentan en CHAT_IP_DAILY_USD y en el tope global como cualquier otra consulta.
MAPAS_DAILY_LIMIT = "60"

# Contador del límite diario. Crear con `npx wrangler kv namespace create RATE_LIMIT`
# y pegar aquí el id que devuelve. Con REQUIRE_KV="true", sin este binding el Worker responde 503.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "0277e4003a8a4dbdb1c7726ef9c3dd3b"

# GEMINI_API_KEY es un secreto: `npx wrangler secret put GEMINI_API_KEY` (nunca en este archivo).
# ANTHROPIC_API_KEY (chat) también es un secreto: `npx wrangler secret put ANTHROPIC_API_KEY`.
