# HEURÍSTICO v1 — valores de partida de literatura micológica divulgativa;
# se recalibran con GBIF (Tarea 9) y hallazgos propios. No son ciencia exacta.
# tiempo: episodio_mm = lluvia en ≤3 días seguidos que dispara la fructificación; ventana_dias = días
# tras el episodio; tmin_media/tmax_media = rango favorable de la media de mínimas/máximas de 10 días.
# tiempo v2 (2026-10-14, docs/investigacion/2026-10-14-factores-y-trucos.md recs. 1, 5, 6; todo HEURÍSTICO):
#   balance_30d_min_mm = mínimo de Σ(lluvia − ET0 FAO) en 30 días (Martínez de Aragón 2007: P−ETP de sep-oct
#   explica la producción; sin umbral publicado: con ET0 de octubre ~2,5 mm/día, −30 exige ≈45 mm en el mes);
#   dias_lluvia_30d_min = días con ≥1 mm en 30 días (Karavani 2018: el nº de días de lluvia predice mejor que los mm);
#   humedad_suelo_min = m³/m³ a 9-27 cm de Open-Meteo que basta aunque el balance no llegue (Karavani: humedad del
#   suelo, mejor predictor; 0,15 ≈ mitad entre suelo seco de septiembre ~0,10 y tras lluvia ~0,18 en Los Alcornocales,
#   medido en Open-Meteo el 2026-10-14). Basta balance O suelo, y además los días de lluvia.
#   meses = temporada; fuera, rojo salvo episodio ≥1,5 × episodio_mm con humedad suficiente (semaforo.ts).
# hábitat v2 (2026-10-14, misma investigación, recs. 2, 3, 4, 7, 8; todo HEURÍSTICO; ver idoneidad.py):
#   dosel.opt = FCC arbolada (%) óptima del MFE (1,0 dentro, 0,6 en 0 % y 100 %); estado de masa Fustal 1 ·
#   Latizal 0,8 · Monte bravo 0,4; incendio ×0,3 a 0–2 años y ×0,6 a 3–5 (micorrizica: true, por defecto);
#   orientación × pendiente ±25 % desde 20° (indiferente: mitad); humedad = peso del índice TWI/cauce 0–100
#   (factor 1 + peso·h; negativo = prefiere suelo drenado); cubierta = pesos de la cubierta desarbolada del MFE
#   (matorral / pastizal_matorral / pastizal) para especies de claros; matorral_cerca = proxy de jaral.
boletus_aereus:
  nombre: Boletus aereus
  arboles: {alcornoque: 1.0, castano: 0.9, encina: 0.8, quejigo: 0.7}
  altitud: {min: 0, opt_min: 300, opt_max: 900, max: 1200}   # calibrado 2026-10-13: alcornocal costero 15-150 m
  orientacion: indiferente
  suelo: {acido: 1.0, otro: 0.5, basico: 0.4, ultrabasico: 0.3, desconocido: 0.6}
  dosel: {opt: [30, 70]}   # v2 heurístico: alcornocal/castañar claro (sin dato de área basimétrica para Quercus)
  humedad: 0.1
  tiempo: {episodio_mm: 25, ventana_dias: [8, 20], tmin_media: [8, 18], tmax_media: [15, 27], balance_30d_min_mm: -30, dias_lluvia_30d_min: 3, humedad_suelo_min: 0.15, meses: [5, 6, 9, 10, 11, 12]}   # heurístico v2: meses con brote de primavera may-jun [inv. §1, F6/G7]
boletus_aestivalis:
  nombre: Boletus aestivalis / reticulatus
  arboles: {castano: 1.0, quejigo: 0.9, alcornoque: 0.7, encina: 0.7}
  altitud: {min: 300, opt_min: 500, opt_max: 1100, max: 1400}
  orientacion: indiferente
  suelo: {acido: 1.0, otro: 0.6, basico: 0.6, ultrabasico: 0.3, desconocido: 0.6}
  dosel: {opt: [40, 75]}   # v2: óptimo FCC intermedio [inv. §5 #2]
  humedad: 0.1
  tiempo: {episodio_mm: 20, ventana_dias: [7, 18], tmin_media: [10, 20], tmax_media: [18, 30], balance_30d_min_mm: -30, dias_lluvia_30d_min: 3, humedad_suelo_min: 0.15, meses: [5, 6, 9, 10, 11]}   # heurístico v2: may-jun + otoño [inv. §5 #6]
boletus_edulis:
  nombre: Boletus edulis
  arboles: {castano: 1.0, pino: 0.7, pinsapo: 0.6, quejigo: 0.5}
  altitud: {min: 600, opt_min: 900, opt_max: 1500, max: 1900}
  orientacion: umbria
  suelo: {acido: 1.0, otro: 0.6, basico: 0.5, ultrabasico: 0.4, desconocido: 0.6}
  dosel: {opt: [50, 85]}   # v2: más denso (Tahvanainen ~25 m²/ha, analogía) 
  humedad: 0.15
  tiempo: {episodio_mm: 25, ventana_dias: [8, 21], tmin_media: [5, 15], tmax_media: [12, 24], balance_30d_min_mm: -20, dias_lluvia_30d_min: 4, humedad_suelo_min: 0.15, meses: [9, 10, 11, 12]}   # heurístico v2: sep-dic; montano, pide más días de lluvia [inv. §2 Karavani]
boletus_pinophilus:
  nombre: Boletus pinophilus
  arboles: {pino: 1.0, castano: 0.5}
  altitud: {min: 700, opt_min: 1000, opt_max: 1600, max: 2000}
  orientacion: umbria
  suelo: {acido: 1.0, otro: 0.6, basico: 0.4, ultrabasico: 0.4, desconocido: 0.6}
  dosel: {opt: [50, 85]}   # v2: pinaster 35–40 m²/ha (de-Miguel 2014)
  humedad: 0.15
  tiempo: {episodio_mm: 25, ventana_dias: [8, 21], tmin_media: [4, 14], tmax_media: [10, 22], balance_30d_min_mm: -20, dias_lluvia_30d_min: 4, humedad_suelo_min: 0.15, meses: [9, 10, 11, 12]}   # heurístico v2: sep-dic como edulis (pinar, sin cita propia)
amanita_caesarea:
  nombre: Amanita caesarea
  arboles: {alcornoque: 1.0, castano: 1.0, encina: 0.8, quejigo: 0.7, pino: 0.4}   # pino: pinares con alcornoque/encina de sotobosque
  altitud: {min: 0, opt_min: 200, opt_max: 900, max: 1200}
  orientacion: solana
  suelo: {acido: 1.0, otro: 0.5, basico: 0.3, ultrabasico: 0.3, desconocido: 0.6}
  dosel: {opt: [30, 70]}   # v2: termófila, rodales con luz
  humedad: 0.0             # solana: sin bonus de vaguada
  tiempo: {episodio_mm: 20, ventana_dias: [7, 16], tmin_media: [12, 20], tmax_media: [20, 30], balance_30d_min_mm: -30, dias_lluvia_30d_min: 3, humedad_suelo_min: 0.15, meses: [7, 8, 9, 10, 11]}   # heurístico v2: jul-nov (termófila, sin cita de meses en inv.)
# ---------------------------------------------------------------- especies nuevas v2 (2026-10-14), HEURÍSTICAS
# Hábitat y tiempo desde docs/investigacion/2026-10-14-factores-y-trucos.md (§1, §2, §5 #8). Sin calibrar salvo n≥10.
lactarius_deliciosus:
  nombre: Lactarius deliciosus
  arboles: {pino: 1.0}
  altitud: {min: 200, opt_min: 500, opt_max: 1500, max: 1900}
  orientacion: umbria
  suelo: {acido: 1.0, ultrabasico: 0.6, otro: 0.6, basico: 0.3, desconocido: 0.6}   # pinar de suelo ácido o bien drenado [G3, G12]
  dosel: {opt: [40, 75]}   # FCC media [inv. §5 #8]
  humedad: 0.1
  tiempo: {episodio_mm: 25, ventana_dias: [20, 40], tmin_media: [3, 14], tmax_media: [10, 22], balance_30d_min_mm: -30, dias_lluvia_30d_min: 4, humedad_suelo_min: 0.15, meses: [10, 11, 12, 1]}   # 3–4 semanas tras lluvia que empape [G3], 30–40 d [F2]; aguanta frío [G13]; oct–ene [§5 #6]
lactarius_sanguifluus:
  # La guía mantiene el níscalo de sangre dentro de la ficha del níscalo (lactarius_deliciosus); aquí solo cambia el suelo.
  nombre: Lactarius sanguifluus
  arboles: {pino: 1.0}
  altitud: {min: 200, opt_min: 500, opt_max: 1500, max: 1900}
  orientacion: umbria
  suelo: {basico: 1.0, otro: 0.6, acido: 0.4, ultrabasico: 0.5, desconocido: 0.6}   # pinar sobre caliza [G3, G12]
  dosel: {opt: [40, 75]}
  humedad: 0.1
  tiempo: {episodio_mm: 25, ventana_dias: [20, 40], tmin_media: [3, 14], tmax_media: [10, 22], balance_30d_min_mm: -30, dias_lluvia_30d_min: 4, humedad_suelo_min: 0.15, meses: [10, 11, 12, 1]}   # como L. deliciosus
cantharellus_cibarius:
  nombre: Cantharellus cibarius
  arboles: {alcornoque: 1.0, quejigo: 1.0, castano: 0.8, encina: 0.6, pino: 0.5}   # alcornocal, quejigar y mixtas con pino [G11]
  altitud: {min: 0, opt_min: 200, opt_max: 1000, max: 1400}
  orientacion: umbria
  suelo: {acido: 1.0, otro: 0.6, basico: 0.4, ultrabasico: 0.4, desconocido: 0.6}
  dosel: {opt: [50, 85]}
  humedad: 0.25            # enclaves frescos: vaguadas, canutos [G11]
  tiempo: {episodio_mm: 20, ventana_dias: [10, 25], tmin_media: [7, 16], tmax_media: [14, 25], balance_30d_min_mm: -20, dias_lluvia_30d_min: 4, humedad_suelo_min: 0.16, meses: [10, 11, 12]}   # sin cita de plazos en inv.: valores de partida
amanita_ponderosa:
  nombre: Amanita ponderosa
  arboles: {encina: 1.0, alcornoque: 1.0, quejigo: 0.4}   # bajo encina o alcornoque con jara [G9]
  altitud: {min: 0, opt_min: 100, opt_max: 700, max: 1000}
  orientacion: indiferente
  suelo: {acido: 1.0, otro: 0.5, ultrabasico: 0.3, basico: 0.2, desconocido: 0.6}   # esquisto o granito, pH ~6 [G9]
  dosel: {opt: [15, 50]}   # necesita luz, borde de calos [G9]
  matorral_cerca: {radio_m: 300, fuera: 0.6}   # el MFE no cartografía la jara: matorral a ≤300 m como proxy (heurístico)
  humedad: 0.0
  tiempo: {episodio_mm: 15, ventana_dias: [7, 21], tmin_media: [3, 12], tmax_media: [12, 22], balance_30d_min_mm: -40, dias_lluvia_30d_min: 3, humedad_suelo_min: 0.12, meses: [2, 3, 4]}   # ~15 mm cada 15–21 d, feb–abr, huevo 3–7 d; <12 °C de media alarga [G9]
macrolepiota_procera:
  nombre: Macrolepiota procera
  # Reescalado 2026-10-14 (×1/0,6, pesos relativos iguales): el máximo de hábitat era 0,6 y la puntuación no pasaba de 60.
  arboles: {alcornoque: 1.0, encina: 1.0, quejigo: 1.0, castano: 1.0, pino: 1.0, pinsapo: 0.5}   # bordes de bosque
  # Calibrado 2026-10-14 (GBIF n=47, todas en recintos arbolados, FCC mediana 65 %): el óptimo de claros (FCC 10–40 %)
  # y el estado de masa bajaban el lift de 3,51 a 1,14 → fuera (sin dosel, peso_estado 0); la cubierta abierta a 0,5.
  peso_estado: 0
  cubierta: {pastizal: 0.833, pastizal_matorral: 0.833, matorral: 0.333}   # claros y pastizal [§1] con peso reducido (0,5/0,6 y 0,2/0,6)
  micorrizica: false       # saprófita: sin penalización por incendio
  altitud: {min: 0, opt_min: 100, opt_max: 1300, max: 1700}
  orientacion: indiferente
  suelo: {acido: 1.0, basico: 0.9, otro: 0.9, ultrabasico: 0.6, desconocido: 0.8}
  humedad: 0.05
  tiempo: {episodio_mm: 20, ventana_dias: [8, 20], tmin_media: [8, 18], tmax_media: [16, 28], balance_30d_min_mm: -30, dias_lluvia_30d_min: 3, humedad_suelo_min: 0.15, meses: [9, 10, 11, 12]}   # sin cita de plazos en inv.: valores de partida
pleurotus_eryngii:
  nombre: Pleurotus eryngii
  arboles: {}              # sin árbol: raíces de Eryngium campestre [G2]
  cubierta: {pastizal: 1.0, pastizal_matorral: 0.7, matorral: 0.2}   # pastizal y herbazal; cunetas y vías pecuarias no están en el MFE
  micorrizica: false
  altitud: {min: 0, opt_min: 200, opt_max: 1200, max: 1600}
  orientacion: indiferente
  suelo: {basico: 1.0, otro: 0.9, acido: 0.7, ultrabasico: 0.4, desconocido: 0.8}
  humedad: 0.0
  tiempo: {episodio_mm: 20, ventana_dias: [10, 20], tmin_media: [6, 16], tmax_media: [14, 26], balance_30d_min_mm: -30, dias_lluvia_30d_min: 3, humedad_suelo_min: 0.15, meses: [10, 11, 12]}   # seta de cardo ~15 d tras la lluvia [F2]
terfezia_arenaria:
  nombre: Terfezia arenaria
  # Suelos arenosos ácidos con Tuberaria guttata (anual de claros): pastizal/matorral abierto o arbolado muy claro.
  # Ningún mapa distingue la arena: el suelo "ácido" (Areniscas del Aljibe, arenas silíceas) es la mejor aproximación.
  arboles: {alcornoque: 0.6, encina: 0.6, pino: 0.5}
  dosel: {opt: [0, 30]}
  cubierta: {pastizal: 1.0, pastizal_matorral: 0.9, matorral: 0.5}
  penaliza_fuego: false    # Tuberaria coloniza los claros quemados: no se aplica la penalización de micorrícicas
  altitud: {min: 0, opt_min: 0, opt_max: 600, max: 900}
  orientacion: indiferente
  suelo: {acido: 1.0, otro: 0.6, basico: 0.2, ultrabasico: 0.2, desconocido: 0.6}
  humedad: -0.1            # prefiere suelo drenado
  tiempo: {episodio_mm: 20, ventana_dias: [20, 45], tmin_media: [6, 14], tmax_media: [16, 26], balance_30d_min_mm: -40, dias_lluvia_30d_min: 3, humedad_suelo_min: 0.12, meses: [3, 4, 5]}   # cosecha mar–may; dependen de la lluvia de sep–oct y de finales de marzo [E14, E24] (el antecedente de otoño no cabe en este esquema)
