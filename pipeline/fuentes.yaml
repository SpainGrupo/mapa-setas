# Fuentes de datos de la Fase 1, verificadas en el spike del 2026-10-13
# (peticiones reales con muestra descargada; nada inventado).
# Lo que no se pudo confirmar queda como PENDIENTE con su motivo.
# Multi-región (2026-10-15): lo regional vive en pipeline/regiones/<id>.yaml; aquí solo lo nacional y compartido.

dem:
  nombre: "MDT IGN/CNIG (PNOA-LiDAR) vía WCS INSPIRE, malla 25 m (Elevacion25830_25)"
  metodo: wcs
  # WCS 2.0.1 (MapServer). Coberturas disponibles: Elevacion25830_{1000,500,200,25,5}
  # (y equivalentes en 4258/4326/4083). Todas salen de PNOA-LiDAR según el Abstract del servicio.
  wcs_url: "https://servicios.idee.es/wcs-inspire/mdt"
  coverage_id: "Elevacion25830_25"
  # Plantilla de GetCoverage. Coordenadas en metros EPSG:25830 (ejes x, y). Verificado: devuelve GeoTIFF
  # int16 (metros enteros), sin compresión, CRS EPSG:25830, rejilla alineada a múltiplos de 25 m.
  url_patron: "https://servicios.idee.es/wcs-inspire/mdt?SERVICE=WCS&VERSION=2.0.1&REQUEST=GetCoverage&CoverageId={coverage_id}&FORMAT=image/tiff&SUBSET=x({xmin},{xmax})&SUBSET=y({ymin},{ymax})"
  # El servidor rechaza peticiones de más de 4096 px por lado (error "MAXSIZE=4096").
  # 100 km x 100 km a 25 m = 4000 px → verificado en una sola petición (32 MB, <1 s).
  tesela_m: 100000
  max_px_por_lado: 4096
  crs: "EPSG:25830"
  resolucion_m: 25
  tipo_dato: int16
  nodata: null            # el GeoTIFF no declara nodata
  mar: "Las celdas de mar valen 0 (verificado frente a Marbella); hay algún valor negativo aislado (-8 m en la costa de Gibraltar)."
  remuestreo: "Local, Resampling.average de 25 m a la malla de 100 m. El servidor no admite interpolación 'average' (solo escala con su método por defecto), así que no se usa SCALEFACTOR."
  cobertura: "Incluye Gibraltar (Peñón 420 m verificado)."
  licencia: "CC BY 4.0 scne.es (ows:AccessConstraints del GetCapabilities; Fees: 'No se aplican condiciones')"
  atribucion: "MDT © Instituto Geográfico Nacional / CNIG (PNOA-LiDAR), CC BY 4.0 scne.es"
  comparacion:
    fecha: 2026-10-13
    metodo: >-
      Dos cajas de 10x10 km en zona forestal, todo llevado a la misma malla de 100 m EPSG:25830 por media
      (Resampling.average), pendiente/orientación con la función de la Tarea 4; se excluye el borde y,
      para la orientación, las celdas con pendiente < 2°.
    cajas:
      genal: "x 296000-306000, y 4045000-4055000 (Valle del Genal, castañar/alcornocal), alt 159-1142 m"
      alcornocales: "x 262000-272000, y 4032000-4042000 (PN Los Alcornocales), alt 36-899 m"
    resultados:
      # dz = Copernicus GLO-30 (DSM) menos IGN. |dpend| en grados. Octante = coincidencia de la orientación en 8 rumbos.
      genal_cop_vs_ign25:   {dz_media_m: 2.73, dz_abs_media_m: 3.90, dz_abs_p95_m: 9.45, dz_abs_max_m: 24.9, dpend_abs_media: 0.88, dpend_abs_p95: 2.40, dorient_mediana: 2.1, dorient_p95: 11.4, octante_coincide_pct: 92.0}
      genal_cop_vs_ign5:    {dz_media_m: 2.81, dz_abs_media_m: 2.99, dz_abs_p95_m: 6.91, dz_abs_max_m: 17.3, dpend_abs_media: 0.55, dpend_abs_p95: 1.43, dorient_mediana: 1.3, dorient_p95: 5.9, octante_coincide_pct: 95.8}
      genal_ign25_vs_ign5:  {dz_media_m: 0.08, dz_abs_media_m: 2.21, dz_abs_p95_m: 4.40, dz_abs_max_m: 9.2, dpend_abs_media: 0.51, dpend_abs_p95: 1.57, dorient_mediana: 1.2, dorient_p95: 7.6, octante_coincide_pct: 94.8}
      alc_cop_vs_ign25:     {dz_media_m: 2.99, dz_abs_media_m: 3.76, dz_abs_p95_m: 11.20, dz_abs_max_m: 20.3, dpend_abs_media: 0.81, dpend_abs_p95: 2.41, dorient_mediana: 2.8, dorient_p95: 14.9, octante_coincide_pct: 90.0}
      alc_cop_vs_ign5:      {dz_media_m: 3.21, dz_abs_media_m: 3.37, dz_abs_p95_m: 9.84, dz_abs_max_m: 17.6, dpend_abs_media: 0.63, dpend_abs_p95: 1.87, dorient_mediana: 2.0, dorient_p95: 10.4, octante_coincide_pct: 93.0}
      alc_ign25_vs_ign5:    {dz_media_m: 0.21, dz_abs_media_m: 1.25, dz_abs_p95_m: 2.95, dz_abs_max_m: 5.2, dpend_abs_media: 0.32, dpend_abs_p95: 0.96, dorient_mediana: 1.2, dorient_p95: 6.7, octante_coincide_pct: 95.5}
    ganador: "IGN MDT25 (WCS Elevacion25830_25)"
    motivo: >-
      Copernicus es un DSM: sobre bosque queda unos +3 m por encima del terreno LiDAR, con picos de 17-25 m
      (dosel), y altera la orientación en el 4-10 % de las celdas en pendiente. A 100 m el efecto es pequeño
      pero sistemático y no aporta nada. El MDT IGN es terreno desnudo (LiDAR), viene ya en EPSG:25830
      (no hay reproyección geográfica), es CC BY 4.0 y se descarga con ~6 peticiones de 100 km.
      MDT05 frente a MDT25 a 100 m: diferencias de 1-2 m y 0,3-0,5° de pendiente; no compensa
      multiplicar por 25 el volumen (teselas de 20 km, unos 4 GB para la zona).
  alternativa_copernicus:
    nombre: Copernicus DEM GLO-30 (AWS Open Data) — DSM, descartado
    url_patron: "https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_N{lat:02d}_00_W{lon:03d}_00_DEM/Copernicus_DSM_COG_10_N{lat:02d}_00_W{lon:03d}_00_DEM.tif"
    teselas_verificadas: "N36 y N37 × W003..W007 responden 200"
    nomenclatura_oeste: "W005 cubre lon -5..-4 (bounds verificados: -5.00014..-4.00014; lat 36.00014..37.00014). Es decir lon_w = -floor(lon)."
    formato: "COG float32, EPSG:4326, 3600x3600, nodata no declarado; sin teselas sobre mar"
    licencia: "Copernicus DEM GLO-30 Public: 'available on a free basis for the general public under the terms and conditions of the Licence' (readme del bucket, enlace a spacedata.copernicus.eu)"

osm:
  # Los extractos de Geofabrik (URL y verificación) van por región: regiones/<id>.yaml → osm_extractos.
  licencia: "ODbL 1.0"
  tags_acceso: {highway: [track, path, footway, bridleway, unclassified, tertiary, secondary, primary, trunk, residential, service]}

mfe:
  nombre: "Mapa Forestal de España (MFE, 'foto fija'), WFS del IEPNB (MITECO), capa foto_fija_mfe:ff_tipo_bosque"
  metodo: wfs
  # La descarga por CCAA (https://gis.miteco.gob.es/descargas/app/DescargaFichero?f=mfe_andalucia.zip,
  # shapefile 885 MB, toda Andalucía, no por provincia) exige superar un reto ALTCHA (anti-bot):
  # no automatizable. Se usa el WFS, que sí es público y lleva los mismos campos y códigos.
  wfs_url: "https://geoserver.iepnb.es/geoserver/wfs"
  capa: "foto_fija_mfe:ff_tipo_bosque"
  # Plantilla verificada (GeoJSON en EPSG:25830, bbox en 25830):
  url_patron: "https://geoserver.iepnb.es/geoserver/wfs?service=WFS&version=2.0.0&request=GetFeature&typeNames=foto_fija_mfe:ff_tipo_bosque&outputFormat=application/json&srsName=EPSG:25830&bbox={xmin},{ymin},{xmax},{ymax},EPSG:25830"
  formato: "GeoJSON (application/json). También SHAPE-ZIP y GeoPackage. Geometría MultiPolygon."
  # Consulta realmente usada en el pipeline (url_patron queda como referencia del spike): la URL la
  # construye vegetacion.plantilla_mfe() con un filtro CQL en lugar de bbox:
  #   cql_filter = id_sp1<>0 AND BBOX(geom,xmin,ymin,xmax,ymax,'EPSG:25830')
  #   count=100 (PAGINA_MFE), startIndex paginado, sortBy=id_ff21 (paginación estable), teselas de 25 km.
  # Motivo: los recintos desarbolados (id_sp1=0) son el fondo y algunos (urbano/'Artificial') son tan
  # grandes que GeoServer corta la respuesta a los 30 s. En GeoServer cql_filter y bbox son excluyentes,
  # por eso el BBOX va dentro del filtro. Se deduplica por id_ff21 (recintos en el borde de teselas).
  volumen: >-
    57 625 recintos en la caja x 160000-410000, y 3990000-4170000 (resultType=hits). Una petición de
    60x40 km devolvió 7 632 recintos sin paginar (sin geometría, 1 MB); con geometría son unos 4 KB por
    recinto, así que conviene trocear la zona en teselas de unos 25-50 km y deduplicar por id_ff21.
    Admite count/startIndex.
  cobertura: "Recintos con y sin arbolado (aparecen 'Desarbolado', id_sp1=0). Provincias vistas en la muestra: Málaga, Cádiz."
  url_por_provincia: "No aplica: el WFS es nacional y se consulta por bbox (ver url_patron)."
  campo_especie_dominante: id_sp1          # int; nombre en nom_sp1. Especie 1 = la de mayor ocupación (nm_o1)
  campo_nombre_especie: nom_sp1
  tabla_codigos_especie: "https://www.miteco.gob.es/content/dam/miteco/es/cartografia-y-sig/ide/descargas/mfe25_dd.xlsx (hoja 'Especies (arbóreas)'); el código 0 = 'Sin especie arbórea' solo aparece en el WFS"
  licencia: "Uso libre y gratuito citando: «© Ministerio para la Transición Ecológica y el Reto Demográfico» (condiciones de la página de descarga del MFE25 Andalucía). El GetCapabilities del WFS declara AccessConstraints NONE, Fees NONE."
  # Clave = código id_sp1 como texto. Lo que no esté aquí → 'otro'; nulo → 'sin_arbolado'.
  # Códigos y nombres tal cual en mfe25_dd.xlsx y, los marcados (*), vistos también en la muestra WFS del Genal/Alcornocales.
  mapeo_arbol:
    "0": sin_arbolado     # Sin especie arbórea (*)
    "46": alcornoque      # Quercus suber (*)
    "45": encina          # "Quercues ilex" en el diccionario; "Quercus ilex " en el WFS (*)
    "245": encina         # Quercus ilex ssp. Ilex
    "44": quejigo         # Quercus faginea (*)
    "47": quejigo         # Quercus canariensis (*)
    "344": quejigo        # Quercus alpestris (quejigo de montaña; decidido 2026-10-13)
    "72": castano         # Castanea sativa (*)
    "20": pino            # Pinos
    "21": pino            # Pinus sylvestris
    "22": pino            # Pinus uncinata
    "23": pino            # Pinus pinea (*)
    "24": pino            # Pinus halepensis (*)
    "25": pino            # Pinus nigra (*)
    "26": pino            # Pinus pinaster (*)
    "27": pino            # Pinus canariensis
    "28": pino            # Pinus radiata (*)
    "29": pino            # Otros pinos
    "229": pino           # Pinus banksiana
    "230": pino           # Pinus strobus
    "32": pinsapo         # Abies pinsapo (*)
  notas_mapeo:
    - "344 Quercus alpestris (vista en la muestra, 3 recintos) → quejigo (decidido 2026-10-13)."
    - "Ojo en clasificar(): si la columna id_sp1 llega como float (por nulos), str(72.0) = '72.0' y no casaría. Convertir a Int64 antes."

geologia:
  nombre: "IGME GEODE — Cartografía geológica continua 1:50.000, capa 'Recintos geología'"
  metodo: arcgis_rest
  url: "https://mapas.igme.es/gis/rest/services/Cartografia_Geologica/IGME_Geode_50/MapServer/8/query"
  # Plantilla verificada (GeoJSON en EPSG:25830, bbox en 25830). maxRecordCount = 1000 → paginar con resultOffset.
  url_patron: "https://mapas.igme.es/gis/rest/services/Cartografia_Geologica/IGME_Geode_50/MapServer/8/query?where=1%3D1&geometry={xmin},{ymin},{xmax},{ymax}&geometryType=esriGeometryEnvelope&inSR=25830&outSR=25830&spatialRel=esriSpatialRelIntersects&outFields=DESC_UNIT,CODE_UNIO&returnGeometry=true&orderByFields=OBJECTID&resultOffset={offset}&resultRecordCount=1000&f=geojson"
  formato: "GeoJSON (f=geojson), también JSON Esri. Capacidades: Map,Query,Data; soporta paginación."
  volumen: "38 267 recintos en la caja lon -6.2..-3.6, lat 36.0..37.6 → unas 39 páginas de 1000."
  campo_litologia: DESC_UNIT      # texto, alias 'Descripción Unidad Geológica'. CODE_UNIO = código de unidad
  licencia: "LICENCIA DE USO: Condiciones de uso público y difusión de la información para la reutilización de los datos IGME, https://www.igme.es/condiciones-de-uso/ (metadatos GEODE zona 2100, catalogo.igme.es)"
  # Subcadenas en minúsculas (clasificar_litologia hace lower() pero no quita tildes, por eso van con tilde).
  # Elegidas sobre los 258 textos DESC_UNIT reales de la zona. Orden de evaluación: ultrabasico → acido → basico.
  mapeo_suelo:
    ultrabasico: ["peridotit", "serpentin", "lherzolit", "harzburgit", "dunita", "tectonitas con espinela"]
    acido: ["granit", "granodiorit", "gneis", "migmat", "pizarra", "esquisto", "cuarcit", "filita", "grauvaca", "grauwaca", "metarenisca", "areniscas del aljibe", "arenas silíceas", "areniscas cuarzo"]
    basico: ["caliza", "calizo", "dolom", "marga", "yeso", "mármol", "marmol", "calcarenit", "calcáre", "carbonat", "travertin", "calcilimolit"]
  notas_mapeo:
    - "Comprobado sobre la zona: Sierra Bermeja = 'Lherzolitas con plagioclasa' (49 %) + 'Tectonitas con espinela' (21 %) + 'Peridotitas granulares' (6 %) → ultrabásico; Los Alcornocales = 'Areniscas del Aljibe' (65 %) → ácido; Grazalema y Sierra de las Nieves con dolomías/calizas → básico (Nieves tiene además 44 % de lherzolitas)."
    - "Reparto aproximado por área en la zona: otro 48,7 % (cuaternario, 'Unidad olistostrómica', arcillas…), básico 39,2 %, ácido 10,4 %, ultrabásico 1,6 %."
    - "Areniscas genéricas ('Areniscas', 'Areniscas y arcillas') quedan en 'otro' a propósito: hay muchas 'Areniscas calcáreas' y con la prioridad ácido > básico una palabra 'arenisca' las haría ácidas."
    - "Casos límite aceptados: 'Calcoesquistos…' y 'Calizas turbidíticas…, grauwacas y pelitas' salen ácidos por 'esquisto'/'grauwaca'; 'Rocas Básicas (Gabros…)', 'Diabasa', 'Ofitas' salen 'otro'."

