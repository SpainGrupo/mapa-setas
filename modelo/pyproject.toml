[project]
name = "setas-modelo"
version = "0.1.0"
description = "Construye el reconocedor offline (BioCLIP visión int8 en ONNX + embeddings de texto) para la PWA."
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.5.1",
  "open-clip-torch==2.29.0",
  "onnx==1.17.0",
  "onnxruntime==1.20.1",
  "numpy>=2.0,<2.3",
  "pillow>=10.4",
  "huggingface-hub>=0.26",
]
