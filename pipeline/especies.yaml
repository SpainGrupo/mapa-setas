lepista_nuda:
  nombre: Lepista nuda
  # Pie azul: saprófita de hojarasca en pinar y encinar, tardía y resistente al frío (sin cifra de estudio local)
  arboles: {pino: 1.0, encina: 1.0, quejigo: 1.0, alcornoque: 1.0, castano: 1.0, sabina: 0.6}
  micorrizica: false       # saprófita: sin penalización por incendio
  altitud: {min: 0, opt_min: 300, opt_max: 1400, max: 1700}
  orientacion: indiferente
  suelo: {basico: 1.0, otro: 0.9, acido: 0.8, ultrabasico: 0.6, desconocido: 0.8}
  humedad: 0.1
  tiempo: {episodio_mm: 20, ventana_dias: [15, 35], tmin_media: [2, 12], tmax_media: [10, 20], balance_30d_min_mm: -30, dias_lluvia_30d_min: 4, humedad_suelo_min: 0.15, meses: [10, 11, 12, 1]}   # valores de partida (patrón de meses GBIF oct–dic, INV §2)
agaricus_campestris:
  nombre: Agaricus campestris
  # Champiñón silvestre: pastizal y prado (INV §2 «perfil nuevo (pastizal)»); sin árbol, como P. eryngii
