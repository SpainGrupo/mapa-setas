  suelo: {basico: 1.0, otro: 0.8, acido: 0.3, ultrabasico: 0.3, desconocido: 0.6}
  humedad: -0.1            # suelo drenado
  tiempo: {episodio_mm: 20, ventana_dias: [20, 45], tmin_media: [6, 14], tmax_media: [16, 26], balance_30d_min_mm: -40, dias_lluvia_30d_min: 3, humedad_suelo_min: 0.12, meses: [2, 3, 4, 5]}   # INV §2; resto como T. arenaria

# ---------------------------------------------------------------- Marbella, especies nuevas (2026-10-18)
# HEURÍSTICOS y sin calibrar hasta que calibracion.py dé n ≥ MIN_OBS. Citas GBIF a ≤200 km de Marbella (consulta
# 18-10-2026): S. bellinii 78 · S. luteus 52 · S. granulatus 44 · R. cyanoxantha 44 · T. portentosum 3. Fuentes:
# [GA] Moreno Arroyo et al., Setas comestibles de Andalucía (ficha S. bellinii de la guía) · [FN] First Nature,
# fichas S. luteus / S. granulatus · [AC] AmanitaCesarea.com, fichas R. cyanoxantha / T. portentosum.
# Suelo, dosel, altitud y las claves de tiempo sin cifra en las fuentes = valores de partida copiados de la especie
# más parecida (PENDIENTE de fuente local); se dice en cada línea.
suillus_bellinii:
  nombre: Suillus bellinii
  # Pinares mediterráneos litorales y de interior (P. halepensis, P. pinaster, P. pinea) [GA]
  arboles: {pino: 1.0}
  altitud: {min: 0, opt_min: 0, opt_max: 800, max: 1300}   # PENDIENTE: «litorales y de interior» [GA] sin cifra
  orientacion: indiferente
